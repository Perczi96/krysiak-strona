name: Aktualizacja najnowszego filmu (RSS – bez klucza API)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz najnowszy film z RSS YouTube
        run: python .github/workflows/scripts/update_latest.py
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest.json
          git diff --cached --quiet || (git commit -m "Aktualizacja najnowszego filmu (RSS)" && git push)