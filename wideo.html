<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wszystkie odcinki, Piotr Krysiak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0b0a;--bone:#efe9df;--soft:#c9c1b4;--mute:#8d857a;--line:#2a2722;--red:#e5322d}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.25rem}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem 1rem;padding:1.1rem 0;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line)}
.top a{text-decoration:none;color:var(--mute)}
.top a:hover{color:var(--bone)}
.head{padding:3.5rem 0 2rem}
.eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:600;margin:0 0 .6rem}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(3rem,10vw,6.5rem);line-height:.92;margin:0 0 1.2rem}
.lead{color:var(--soft);max-width:36rem;margin:0 0 1.6rem}
.btn{display:inline-block;padding:.85rem 1.3rem;text-decoration:none;font-weight:600;font-size:.85rem;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--bone);transition:background .2s,color .2s}
.btn:hover{background:var(--bone);color:var(--ink)}
.btn.solid{background:var(--red);border-color:var(--red);color:#fff}
.player{margin:1.5rem 0 4rem}
.video-wrap{position:relative;padding-top:56.25%;background:#000;border:1px solid var(--line)}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.note{margin-top:1rem;font-size:.85rem;color:var(--mute)}
footer{padding:2rem 0 3rem;border-top:1px solid var(--line);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="index.html">Piotr Krysiak</a>
    <a href="index.html#najnowszy">Najnowszy odcinek</a>
  </header>

  <section class="head">
    <p class="eyebrow">Bez maski</p>
    <h1>Wszystkie<br>odcinki</h1>
    <p class="lead">Pełna lista wgranych odcinków programu. Najnowszy jest pierwszy.</p>
    <a class="btn solid" href="https://www.youtube.com/@Piotr_Krysiak/videos" target="_blank" rel="noopener">Otwórz kanał na YouTube</a>
  </section>

  <section class="player">
    <div class="video-wrap">
      <iframe src="https://www.youtube.com/embed/videoseries?list=UUxvlqDrUSBomr0I5kHe20ug" title="Wszystkie odcinki Bez maski" allowfullscreen></iframe>
    </div>
    <p class="note">Jeśli odtwarzacz się nie wczytuje, użyj przycisku powyżej.</p>
  </section>

  <footer>© Piotr Krysiak · Ciągle sprawdzam</footer>
</div>
</body>
</html>
