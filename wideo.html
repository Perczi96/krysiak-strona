<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wszystkie filmy - Piotr Krysiak</title>
<style>
  :root { --bg:#0d0d0f; --panel:#17171b; --text:#f2efe9; --muted:#a8a39a; --accent:#e0237a; --gold:#d4af6a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--text); line-height:1.6; }
  header { padding:2rem 1.25rem 1.25rem; text-align:center; border-bottom:1px solid #2a2a30; }
  header h1 { margin:0 0 .3rem; font-size:1.9rem; }
  header a { color:var(--gold); font-family:Arial, sans-serif; font-size:.95rem; text-decoration:none; }
  header a:hover { color:var(--accent); }
  main { max-width:960px; margin:0 auto; padding:1.5rem 1.25rem 3rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:1.2rem; }
  .card { background:var(--panel); border-radius:8px; overflow:hidden; }
  .video-wrap { position:relative; padding-top:56.25%; background:#000; }
  .video-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .card h3 { font-size:1rem; margin:.7rem .9rem .9rem; font-weight:normal; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:2rem 1rem; border-top:1px solid #2a2a30; font-family:Arial, sans-serif; }
</style>
</head>
<body>

<header>
  <h1>Wszystkie filmy</h1>
  <a href="index.html">← Wróć na stronę główną</a>
</header>

<main>
  <p style="text-align:center;margin:0 0 1.2rem;"><a href="https://www.youtube.com/@Piotr_Krysiak/videos" style="color:#e0237a;font-family:Arial,sans-serif;">Otwórz kanał na YouTube</a></p>
  <div class="video-wrap" style="border-radius:8px;">
    <iframe src="https://www.youtube.com/embed/videoseries?list=UUxvlqDrUSBomr0I5kHe20ug" title="Wszystkie filmy" allowfullscreen></iframe>
  </div>
</main>

<footer>© Piotr Krysiak</footer>

</body>
</html>
