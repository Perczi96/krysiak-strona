    <!-- PWA Install Prompt Meta -->
    <meta name="apple-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <div id="app-error" style="display:none;padding:24px;margin:16px;border-radius:12px;background:#14171D;color:#F5F7FA;font:16px/1.5 system-ui, sans-serif;border:1px solid #D92D20;max-width:960px;white-space:pre-wrap;word-break:break-word"></div>
    <script>
      (function () {
        var box = document.getElementById('app-error');
        function show(title, err) {
          if (!box) return;
          box.style.display = 'block';
          var msg = (err && (err.stack || err.message || String(err))) || String(err || 'Unknown error');
          box.textContent = title + '\n\n' + msg;
          box.style.color = '#F5F7FA';
        }
        window.onerror = function (message, source, lineno, colno, error) {
          show('Window error:', error || (message + ' @ ' + source + ':' + lineno + ':' + colno));
        };
        window.addEventListener('unhandledrejection', function (event) {
          show('Unhandled promise rejection:', event.reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration (handled by vite-plugin-pwa) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // SW registration failed - not critical
          });
        });
      }

      // iOS PWA detection
      if (window.navigator.standalone === true) {
        document.documentElement.classList.add('pwa-standalone');
      }
    </script>
  </body>
