# Supabase Local Development Configuration
# Run: supabase start (requires Docker)

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
port = 54327
jwt_secret = "super-secret-jwt-token-with-at-least-32-characters-long"
external_url = "http://localhost:54321"
site_url = "http://localhost:5173"
redirect_url = "http://localhost:5173/auth"
disable_signup = false
email_confirm = false
phone_confirm = false
max_frequency = "1h"
mailer_autoconfirm = false
mailer_send_timeout = "30s"
mailer_subject = "Confirm your signup"
smtp_admin_email = "admin@example.com"
smtp_host = "localhost"
smtp_port = "2525"
smtp_user = ""
smtp_pass = ""
smtp_sender_name = "Bez Maski"

[auth.external]
google = { enabled = false, client_id = "", secret = "" }
github = { enabled = false, client_id = "", secret = "" }
gitlab = { enabled = false, client_id = "", secret = "" }
bitbucket = { enabled = false, client_id = "", secret = "" }
discord = { enabled = false, client_id = "", secret = "" }
slack = { enabled = false, client_id = "", secret = "" }
twitter = { enabled = false, client_id = "", secret = "" }
facebook = { enabled = false, client_id = "", secret = "" }
apple = { enabled = false, client_id = "", secret = "" }

[storage]
enabled = true
port = 54328
file_size_limit = "50MiB"

[functions]
enabled = true
port = 54329
verify_jwt = true

[realtime]
enabled = true
port = 54330
ip_version = "ipv4"

[log]
level = "info"

[edge_runtime]
policy = "permissive"