<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b87a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7d4a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#111111" stroke="url(#goldGradient)" stroke-width="2"/>
  <!-- Play button triangle -->
  <polygon points="38,30 38,70 72,50" fill="url(#goldGradient)"/>
  <!-- "BM" text for small sizes -->
  <text x="50" y="68" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle" opacity="0.3">BM</text>
</svg>